[project]
name = "langgraph-workflows"
version = "0.1.0"
description = "Workflows LangGraph para detección de conflictos legales"
requires-python = ">=3.13.0,<3.14.0"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

