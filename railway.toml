# Railway.toml - Multi-service deployment configuration
# Docs: https://docs.railway.app/deploy/config-as-code
#
# ⚠️ IMPORTANTE: Este archivo SOLO funciona si los servicios están creados en Railway UI
# con sus Root Directories configurados correctamente.
#
# Para cada servicio en Railway UI:
# - Backend: Root Directory = "backend", Dockerfile Path = "docker/Dockerfile"
# - Frontend: Root Directory = "frontend", Dockerfile Path = "docker/Dockerfile"

# Backend service configuration
[deploy.backend]
startCommand = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn wsgi:application --bind 0.0.0.0:$PORT"
healthcheckPath = "/api/health/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[deploy.backend.build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
dockerContext = "backend"

# Frontend service configuration
[deploy.frontend]
startCommand = "serve -s dist -l $PORT"

[deploy.frontend.build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"
dockerContext = "frontend"
dockerTarget = "runtime"
